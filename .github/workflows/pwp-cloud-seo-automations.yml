name: "Prints With Passion — Cloud GMC Shopping, Technical SEO, GSC Forecast & Link Sculptor"

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
    - cron: "0 6 * * 1"
    - cron: "0 6 * * 3"
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run (all, daily-gmc, daily-seo, weekly-monday, weekly-wednesday)"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  pwp-cloud-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      SHOPIFY_STORE_DOMAIN: "bpcprints.myshopify.com"
      PWP_GSC_SITE_URL: "sc-domain:printswithpassion.com"
      PWP_GA4_PROPERTY_ID: "363520144"
      PWP_GMC_MERCHANT_ID: "742631169"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 0. Sync Live GSC, GA4 & GMC Telemetry via Google Cloud Service Account
        run: |
          node lib/google-cloud-api.mjs --self-test
          node cloud-gsc-ga4-gmc-sync.mjs

      - name: 1. Daily 03:30 Suite — GMC Shopping Feed, Google Images Visual Pack & Spec-First CTR Optimizer
        if: github.event.schedule == '30 3 * * *' || inputs.suite == 'all' || inputs.suite == 'daily-gmc'
        run: |
          node ../pwp-product-factory/daily_gmc_free_listings_optimizer.mjs
          node ../pwp-product-factory/google_images_and_visual_pack_optimizer.mjs
          node ../pwp-product-factory/gmc_diagnostics_and_catalog_sync.mjs

      - name: 2. Daily 04:30 Suite — Technical SEO, Uniqueness/Lint Gate, 404 Self-Healer & AI Citation Audit
        if: github.event.schedule == '30 4 * * *' || inputs.suite == 'all' || inputs.suite == 'daily-seo'
        run: |
          node catalog_uniqueness_and_seo_lint_gate.mjs
          node ga4_cro_and_404_healer.mjs
          node ai_shopping_assistant_geo_optimizer.mjs

      - name: 3. Weekly Monday 06:00 Suite — GSC Sitemap/404 Triage, Forecast-vs-Actuals & Strike-Zone CTR Rewriter
        if: github.event.schedule == '0 6 * * 1' || inputs.suite == 'all' || inputs.suite == 'weekly-monday'
        run: |
          node gsc_sitemap_404_and_toxic_query_sync.mjs
          node weekly_gsc_forecast_and_strikezone_tracker.mjs
          node discover_transactional_keywords.mjs
          node strikezone_ctr_and_competitor_rewriter.mjs
          node competitor_serp_diff_and_gap_radar.mjs
          node gsc_cannibalization_and_intent_resolver.mjs

      - name: 4. Weekly Wednesday 06:00 Suite — Active Internal Link Sculptor, Visualizer & Earned Authority
        if: github.event.schedule == '0 6 * * 3' || inputs.suite == 'all' || inputs.suite == 'weekly-wednesday'
        run: |
          node internal_link_equity_sculptor.mjs
          node interactive_size_visualizer_injector.mjs
          node earned_authority_and_syndication_tracker.mjs
